server:
  port: ${PORT:8080}
spring:
  application:
    name: doan

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update


    show-sql: false

    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET:VGhpc0lzTXlTdXBlclNlY3JldEtleTEyMzQ1Ng==}